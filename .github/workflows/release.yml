name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Generate debug keystore (used as release signing fallback)
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SMSGate,O=SMSGate,C=GH" 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          # If you add a real keystore later, set these in GitHub repo secrets
          RELEASE_STORE_FILE: ""
          RELEASE_STORE_PASSWORD: ""
          RELEASE_KEY_ALIAS: ""
          RELEASE_KEY_PASSWORD: ""

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/smsgate.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SMSGate ${{ github.ref_name }}
          body: |
            ## Install on Android

            1. On your Android phone open **Chrome** and go to:
               `https://github.com/t-boye/SMSGate-App/releases/latest/download/smsgate.apk`
            2. Tap **Download** when prompted
            3. Open your Downloads app and tap **smsgate.apk**
            4. If prompted, enable **"Install unknown apps"** for Chrome
            5. Tap **Install** → **Open**
            6. Go to **Settings** → enter your Server URL and Device credentials from the dashboard

            ## What's new in ${{ github.ref_name }}
            See commit history for changes.
          files: android/app/build/outputs/apk/release/smsgate.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
