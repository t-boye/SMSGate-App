name: Build & Release APK

on:
  push:
    tags:
      - 'v*'           # triggers on v1.0, v1.2.3, etc.
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/smsgate.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SMSGate ${{ github.ref_name }}
          body: |
            ## Install

            1. On your Android phone, open this URL in Chrome:
               **https://sms-gate-app.vercel.app**
            2. Tap **Download APK**
            3. Enable "Install from unknown sources" if prompted
            4. Install and open the app
            5. Go to Settings → Cloud Server → enter your credentials
          files: android/app/build/outputs/apk/release/smsgate.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
